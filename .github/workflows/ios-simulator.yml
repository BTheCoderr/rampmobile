name: iOS Simulator preview (manual)

# Manual only: macOS build minutes are expensive, and this is not an
# installable iPhone/TestFlight IPA. No Apple Developer credentials needed.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-simulator:
    name: Compile unsigned iOS Simulator app
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CI: '1'
      EXPO_PUBLIC_RAMP_DIRECTORY_URL: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Validate prototype and TypeScript
        run: |
          npm run preflight
          npm run validate-data
          npm run test:unit
          npm run typecheck
          npm run check:expo-compatibility
      - name: Generate iOS native project
        run: npx expo prebuild --platform ios --clean --no-install
      - name: Install CocoaPods
        working-directory: ios
        run: pod install
      - name: Compile unsigned Simulator app
        run: |
          set -euxo pipefail
          WORKSPACE=$(find ios -maxdepth 1 -type d -name '*.xcworkspace' -print -quit)
          test -n "$WORKSPACE"
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          xcodebuild -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios-build \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Package Simulator app
        run: |
          set -euxo pipefail
          APP=$(find ios-build/Build/Products/Debug-iphonesimulator -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$APP"
          cd "$(dirname "$APP")"
          zip -qr "$GITHUB_WORKSPACE/rampmobile-ios-simulator.zip" "$(basename "$APP")"
      - name: Upload Simulator artifact
        uses: actions/upload-artifact@v4
        with:
          name: rampmobile-ios-simulator
          path: rampmobile-ios-simulator.zip
          retention-days: 14
          if-no-files-found: error
