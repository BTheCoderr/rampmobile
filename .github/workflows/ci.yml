name: Mobile prototype checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Validate Expo starter
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check sample data
        run: npm run validate-data
      - name: Unit tests
        run: npm run test:unit
      - name: TypeScript check
        run: npm run typecheck
      - name: Expo dependency compatibility
        run: npm run check:expo-compatibility
      - name: iOS JavaScript bundle smoke test
        run: npm run check:bundle:ios
      - name: Android JavaScript bundle smoke test
        run: npm run check:bundle:android
